# Hardened nginx config for marco.figueroa-sanchez.com
#
# - Runs as an unprivileged user on port 8080 (TLS is terminated by the upstream Ingress/proxy).
# - Compatible with a read-only root filesystem: only /tmp must be writable.
# - __CSP_SCRIPT_HASHES__ is replaced at image build time by docker/csp-hashes.pl.
# - /projects, /experience and /blog, and their Spanish versions under /es, are rendered on
#   demand by the Node SSR sidecar (`ssr` image target) on 127.0.0.1:4000; everything else,
#   including the Spanish home /es, is the prerendered static build.
# - A first visit to an English page from a browser whose first language is Spanish, without a
#   remembered choice (`lang` cookie), is redirected to its /es equivalent (Spec 004 RF-127).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Writable paths for an unprivileged worker
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
    '"referer":"$http_referer","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json;

  # Information disclosure
  server_tokens off;
  autoindex off;
  absolute_redirect off;
  port_in_redirect off;
  server_name_in_redirect off;

  # Transfer
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # Timeouts (slow-client protection)
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 10s;
  keepalive_timeout 15s;
  keepalive_requests 100;
  reset_timedout_connection on;

  # Request size limits: static site, no request bodies expected
  client_max_body_size 1k;
  client_body_buffer_size 1k;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  # Real client IP from the trusted Ingress/proxy (for accurate logs)
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Compression
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml application/javascript application/json application/xml
    application/manifest+json image/svg+xml image/x-icon;

  types {
    application/manifest+json webmanifest;
  }

  # Cache policy, set once at server level so location blocks never drop security headers.
  # English pages depend on the language redirect below, so shared caches must not keep them
  # (Spec 004 RF-130).
  map $uri $cache_control {
    default "public, max-age=86400";
    / "private, no-cache";
    /index.html "private, no-cache";
    /blog/rss.xml "no-cache";
    "~^/(?:projects|experience|blog)(?:/|$)" "private, no-cache";
    "~^/es(?:/|$)" "no-cache";
    ~\.html$ "no-cache";
    "~-[A-Z0-9]{8}\.(?:js|css)$" "public, max-age=31536000, immutable";
  }

  # English pages that a first visit in Spanish is redirected from: the home and the content
  # pages, never the feed, files or static assets (RF-127, RF-129).
  map $uri $lang_redirectable {
    default 0;
    / 1;
    /blog/rss.xml 0;
    "~^/(?:projects|experience|blog)(?:/|$)" 1;
  }

  # Redirect when the page is redirectable, there is no `lang` cookie (RF-128) and the first
  # preferred language is any variant of Spanish (es, es-CL, es-419...).
  map "$lang_redirectable:$cookie_lang:$http_accept_language" $lang_redirect {
    default 0;
    "~*^1::\s*es(?:[-;,]|$)" 1;
  }

  # Responses of redirectable pages differ by language preference and cookie (RF-130); an empty
  # value adds no header.
  map $lang_redirectable $lang_vary {
    default "";
    1 "Accept-Language, Cookie";
  }

  # Unknown hosts: only the health probe answers, everything else is dropped
  server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 444;
    }
  }

  server {
    listen 8080;
    server_name marco.figueroa-sanchez.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' __API_ORIGIN__; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cache-Control $cache_control always;
    add_header Vary $lang_vary always;

    # Read-only site
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # First visit in Spanish: temporary redirect to the Spanish page (RF-127). Only `return`
    # inside `if`, so the server-level headers above are kept.
    if ($lang_redirect) {
      return 302 /es$request_uri;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    # The Spanish home's canonical URL is /es (no trailing slash), so it is served without the
    # directory redirect to /es/; /es/ is served by `location /`.
    location = /es {
      try_files /es/index.html =404;
    }

    # Dotfiles (except ACME/well-known), source maps and editor/backup leftovers
    location ~ /\.(?!well-known/) {
      return 404;
    }

    location ~* \.(?:map|bak|old|orig|swp|tmp)$ {
      return 404;
    }

    # Content pages rendered on each request by the SSR sidecar, in English and under /es
    # (after the deny rules above, so dotfiles and leftovers under these paths still answer 404).
    # The prerendered Spanish home is served by `location = /es` and `location /`.
    location ~ ^/(?:es/)?(?:projects|experience|blog)(?:/|$) {
      proxy_pass http://127.0.0.1:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
      # The server-level Cache-Control ($cache_control) is the only one sent.
      proxy_hide_header Cache-Control;
    }
  }
}
