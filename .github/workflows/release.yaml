name: 'Portfolio Release'

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: portfolio-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Build Application'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 'Installing PNPM'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true

      - name: 'Build Application'
        run: 'pnpm run build'
        env:
          API_URL: ${{ secrets.API_URL }}

      - name: 'Check SSR CSP Hashes'
        run: 'scripts/check-ssr-csp.sh'

      - name: 'Upload Build'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: portfolio
          path: ./dist

  package:
    name: 'Build Docker Image'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
      ssr-digest: ${{ steps.build-ssr.outputs.digest }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: 'Download Build'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: portfolio
          path: ./dist

      - name: 'Project Version'
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: 'Login to Docker Hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: 'Build Multi-Platform Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          target: static
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=${{ secrets.API_URL }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio:latest
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio:${{ steps.version.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio:sha-${{ github.sha }}

      - name: 'Build Multi-Platform SSR Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build-ssr
        with:
          context: .
          target: ssr
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio-ssr:latest
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio-ssr:${{ steps.version.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio-ssr:sha-${{ github.sha }}

  deploy:
    name: 'Application Deployment'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 'Connecting to Local Network'
        uses: twingate/github-action@358e205bb31e636fef1dfb706228ab60eb90c181
        with:
          service-key: ${{ secrets.LOCAL_NETWORK }}

      - name: 'Deploy Application'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/portfolio portfolio=${{ vars.DOCKERHUB_USERNAME }}/portfolio@${{ needs.package.outputs.digest }} ssr=${{ vars.DOCKERHUB_USERNAME }}/portfolio-ssr@${{ needs.package.outputs.ssr-digest }} -n portfolio

      - name: 'Verify Deployment'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/portfolio -n portfolio
