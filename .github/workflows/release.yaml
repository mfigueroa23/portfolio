name: 'Portfolio Release'

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: portfolio-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 'Verify Application'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Installing PNPM'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true
          require-lockfile: true

      - name: 'Unit Tests'
        run: 'pnpm test --watch=false'

      - name: 'Build Application'
        run: 'pnpm run build'
        env:
          API_URL: ${{ secrets.API_URL }}
          AGENT_URL: ${{ vars.AGENT_URL }}

      - name: 'Check SSR CSP Hashes'
        run: 'scripts/check-ssr-csp.sh'

  # Spec 009, RF-31 to RF-35: the images are built into a registry local to the job, scanned
  # there for both platforms and only copied to Docker Hub when the gate passes, keeping the
  # scanned digests, which deploy pins (plan D7). Then one SBOM per image and platform (D8).
  package:
    name: 'Build, Scan and Publish Images'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    services:
      registry:
        image: registry:3@sha256:01cd312e67026f06f5d89c3e133a4a9adc7cb9eeb9b1194e0b2954dfd770efd2
        ports:
          - 5000:5000
    env:
      LOCAL: localhost:5000
      GRYPE_REGISTRY_INSECURE_USE_HTTP: 'true'
      SYFT_REGISTRY_INSECURE_USE_HTTP: 'true'
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
      ssr-digest: ${{ steps.build-ssr.outputs.digest }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Project Version'
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      # Logged in before building only to pull the base images with a quota; nothing is pushed to
      # Docker Hub until the scan gate passes.
      - name: 'Login to Docker Hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # Host network and plain HTTP so the builder and imagetools reach the job's registry.
      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
              insecure = true

      - name: 'Build Multi-Platform Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          target: static
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=${{ secrets.API_URL }}
            AGENT_URL=${{ vars.AGENT_URL }}
          push: true
          tags: ${{ env.LOCAL }}/portfolio:${{ github.sha }}

      - name: 'Build Multi-Platform SSR Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build-ssr
        with:
          context: .
          target: ssr
          platforms: linux/amd64,linux/arm64
          build-args: |
            API_URL=${{ secrets.API_URL }}
            AGENT_URL=${{ vars.AGENT_URL }}
          push: true
          tags: ${{ env.LOCAL }}/portfolio-ssr:${{ github.sha }}

      - name: 'Download Grype'
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.120.1
          cache-db: true

      - name: 'Download Syft'
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: 'Scan Images'
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          for image in portfolio portfolio-ssr; do
            for arch in amd64 arm64; do
              "$GRYPE" "registry:$LOCAL/$image:$GITHUB_SHA" --platform "linux/$arch" \
                -o json="grype-$image-$arch.json" -o sarif="grype-$image-$arch.sarif"
            done
          done

      - name: 'Check Findings'
        run: |
          node scripts/sca-gate.mjs \
            --title 'portfolio (linux/amd64)' --report grype-portfolio-amd64.json \
            --title 'portfolio (linux/arm64)' --report grype-portfolio-arm64.json \
            --title 'portfolio-ssr (linux/amd64)' --report grype-portfolio-ssr-amd64.json \
            --title 'portfolio-ssr (linux/arm64)' --report grype-portfolio-ssr-arm64.json

      # One code scanning category per SARIF file: several runs may not share one.
      - name: 'Upload Scan (portfolio, amd64)'
        if: ${{ always() && hashFiles('grype-portfolio-amd64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: grype-portfolio-amd64.sarif
          category: sca-image-static-amd64

      - name: 'Upload Scan (portfolio, arm64)'
        if: ${{ always() && hashFiles('grype-portfolio-arm64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: grype-portfolio-arm64.sarif
          category: sca-image-static-arm64

      - name: 'Upload Scan (portfolio-ssr, amd64)'
        if: ${{ always() && hashFiles('grype-portfolio-ssr-amd64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: grype-portfolio-ssr-amd64.sarif
          category: sca-image-ssr-amd64

      - name: 'Upload Scan (portfolio-ssr, arm64)'
        if: ${{ always() && hashFiles('grype-portfolio-ssr-arm64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: grype-portfolio-ssr-arm64.sarif
          category: sca-image-ssr-arm64

      # imagetools copies each manifest list as is, so Docker Hub gets the scanned digests.
      - name: 'Publish Images'
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SSR_DIGEST: ${{ steps.build-ssr.outputs.digest }}
        run: |
          publish() {
            local image=$1 digest=$2 published
            docker buildx imagetools create \
              --tag "$REPOSITORY/$image:latest" \
              --tag "$REPOSITORY/$image:$VERSION" \
              --tag "$REPOSITORY/$image:sha-$GITHUB_SHA" \
              "$LOCAL/$image@$digest"
            published=$(docker buildx imagetools inspect "$REPOSITORY/$image:sha-$GITHUB_SHA" \
              --format '{{json .Manifest}}' | jq -r .digest)
            if [ "$published" != "$digest" ]; then
              echo "::error::$image was published as $published instead of the scanned $digest"
              exit 1
            fi
          }
          publish portfolio "$DIGEST"
          publish portfolio-ssr "$SSR_DIGEST"

      - name: 'Generate SBOMs'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.value }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SSR_DIGEST: ${{ steps.build-ssr.outputs.digest }}
        run: |
          sbom() {
            local image=$1 digest=$2
            mkdir -p "sbom/$image"
            for arch in amd64 arm64; do
              "$SYFT" scan "registry:$LOCAL/$image@$digest" --platform "linux/$arch" \
                --source-name "$REPOSITORY/$image:$VERSION" \
                -o spdx-json="sbom/$image/$image-$VERSION-linux-$arch.spdx.json"
            done
          }
          sbom portfolio "$DIGEST"
          sbom portfolio-ssr "$SSR_DIGEST"

      - name: 'Upload SBOM (portfolio)'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-${{ steps.version.outputs.value }}-sbom
          path: sbom/portfolio/
          if-no-files-found: error

      - name: 'Upload SBOM (portfolio-ssr)'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-ssr-${{ steps.version.outputs.value }}-sbom
          path: sbom/portfolio-ssr/
          if-no-files-found: error

  deploy:
    name: 'Application Deployment'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 'Connecting to Local Network'
        uses: twingate/github-action@358e205bb31e636fef1dfb706228ab60eb90c181 # v1.11
        with:
          service-key: ${{ secrets.LOCAL_NETWORK }}

      - name: 'Deploy Application'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f # v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/portfolio portfolio=${{ vars.DOCKERHUB_USERNAME }}/portfolio@${{ needs.package.outputs.digest }} ssr=${{ vars.DOCKERHUB_USERNAME }}/portfolio-ssr@${{ needs.package.outputs.ssr-digest }} -n portfolio

      - name: 'Verify Deployment'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f # v2.1.1
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/portfolio -n portfolio
