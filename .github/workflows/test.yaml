name: 'Portfolio Tests'

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: portfolio-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 'Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Installing PNPM'
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true
          require-lockfile: true

      - name: 'Run Tests'
        run: 'pnpm test --watch=false'

      - name: 'Script Tests'
        run: 'node --test scripts/'

      - name: 'Build Application'
        run: 'pnpm run build'

      - name: 'Check SSR CSP Hashes'
        run: 'scripts/check-ssr-csp.sh'
