<form
  class="flex flex-col gap-1.5 border-t border-border bg-card p-3 pb-5 md:pb-3"
  novalidate
  (submit)="onSubmit($event)"
>
  <label for="assistant-input" class="sr-only">{{ t().inputLabel }}</label>
  <div
    class="flex items-end gap-2 rounded-2xl border bg-background py-1.5 pr-1.5 pl-4 transition-colors focus-within:border-primary"
    [class.border-border]="!check().tooLong"
    [class.border-highlight]="check().tooLong"
  >
    <textarea
      #field
      id="assistant-input"
      rows="1"
      [placeholder]="t().placeholder"
      [value]="draft()"
      (input)="draft.set($any($event.target).value)"
      (keydown.enter)="onEnter($event)"
      [attr.aria-invalid]="check().tooLong || null"
      aria-describedby="assistant-input-hint"
      class="max-h-32 min-w-0 flex-1 resize-none bg-transparent py-2 text-base leading-normal text-foreground outline-none [field-sizing:content] placeholder:text-muted-foreground md:text-sm"
    ></textarea>
    <button
      type="submit"
      [disabled]="!canSend()"
      [attr.aria-label]="t().send"
      class="grid size-11 shrink-0 cursor-pointer place-items-center rounded-xl bg-primary text-primary-foreground transition-opacity focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 focus-visible:ring-offset-card disabled:cursor-not-allowed disabled:opacity-40 md:size-10"
    >
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
  <div
    id="assistant-input-hint"
    class="flex justify-between gap-2 px-1 text-[11px]"
    [class.text-muted-foreground]="!check().tooLong"
    [class.text-highlight]="check().tooLong"
  >
    <span>{{ check().tooLong ? t().tooLong(max) : t().hint }}</span>
    <span class="tabular-nums">{{ t().counter(check().length, max) }}</span>
  </div>
</form>
