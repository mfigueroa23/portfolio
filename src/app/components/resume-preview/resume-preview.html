<!-- Full screen below md; a centered window over the dimmed page from md (RF-24, RF-25). The
     dialog keeps the browser's `display: none` while closed, so the layout lives inside it. -->
<dialog
  #dialog
  aria-labelledby="resume-preview-title"
  class="resume-preview m-0 w-screen h-dvh max-w-none max-h-none p-0 bg-card text-foreground md:m-auto md:w-[calc(100%-4rem)] md:max-w-3xl md:h-[90dvh] md:rounded-3xl md:border md:border-primary/30 backdrop:bg-background/80 backdrop:backdrop-blur-sm"
  (click)="onDialogClick($event)"
  (close)="onClosed()"
  (keydown.escape)="close()"
>
  <div class="flex flex-col h-full">
    <header
      class="flex items-center justify-between gap-4 px-4 py-3 md:px-6 md:py-4 border-b border-border"
    >
      <h2 id="resume-preview-title" class="text-lg md:text-xl font-bold">
        {{ m().resumePreview.title }}
      </h2>
      <div class="flex items-center gap-2">
        <button
          type="button"
          data-download
          [attr.aria-label]="m().resumePreview.downloadLabel"
          [disabled]="state().kind !== 'ready'"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-primary text-primary-foreground font-medium hover:bg-primary/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer"
          (click)="download()"
        >
          <i class="fa-solid fa-download" aria-hidden="true"></i>
          <span class="hidden sm:inline">{{ m().resumePreview.download }}</span>
        </button>
        <button
          type="button"
          data-close
          [attr.aria-label]="m().resumePreview.close"
          class="p-2 rounded-full text-muted-foreground hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary cursor-pointer"
          (click)="close()"
        >
          <i class="fa-solid fa-xmark text-xl" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto overscroll-contain p-4 md:p-6">
      @if (state().kind === 'loading') {
        <p
          role="status"
          class="flex items-center justify-center gap-3 h-full text-muted-foreground"
        >
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          {{ m().resumePreview.loading }}
        </p>
      } @else if (errorText(); as errorText) {
        <div
          role="alert"
          class="flex flex-col items-center justify-center gap-4 h-full text-center"
        >
          <p class="flex items-center gap-3 text-red-400">
            <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
            {{ errorText }}
          </p>
          <button
            type="button"
            data-retry
            class="inline-flex items-center gap-2 px-5 py-2 rounded-full glass text-primary font-medium hover:bg-primary/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary cursor-pointer"
            (click)="retry()"
          >
            <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
            {{ m().resumePreview.retry }}
          </button>
        </div>
      } @else {
        <div #pages class="flex flex-col items-center gap-4">
          @for (page of pageNumbers(); track page) {
            <canvas
              #page
              role="img"
              [attr.aria-label]="m().resumePreview.page(page, pageNumbers().length)"
              class="block max-w-full bg-white shadow-lg"
            ></canvas>
          }
        </div>
      }
    </div>
  </div>
</dialog>
