<nav [attr.aria-label]="language.m().nav.language" class="flex items-center gap-1 text-sm">
  @for (option of options; track option.lang) {
    @let current = option.lang === language.lang();
    <a
      [href]="language.alternates()[option.lang]"
      [attr.lang]="option.lang"
      [attr.hreflang]="option.lang"
      [attr.aria-current]="current ? 'true' : null"
      (click)="language.remember(option.lang)"
      class="px-2 py-1 rounded-full font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
      [class]="
        current ? 'text-primary bg-primary/10' : 'text-muted-foreground hover:text-foreground'
      "
      >{{ option.label }}</a
    >
  }
</nav>
