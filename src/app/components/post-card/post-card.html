@let item = post();
<article
  class="relative glass rounded-2xl overflow-hidden flex flex-col h-full hover:border-primary/40 transition-colors"
  [attr.lang]="language.itemLang(item)"
>
  @if (item.coverUrl) {
    <img
      [src]="item.coverUrl"
      [alt]="item.title"
      loading="lazy"
      class="w-full aspect-video object-cover"
    />
  }
  <div class="p-6 flex flex-col gap-3">
    <p
      class="flex items-center gap-2 text-sm text-muted-foreground"
      [attr.lang]="language.itemLang(item) && language.lang()"
    >
      <app-local-date [iso]="item.publishedAt" />
      <span aria-hidden="true">·</span>
      <span>{{ m().pages.readingTime(item.readingMinutes) }}</span>
    </p>
    <h3 class="text-xl font-semibold">
      <!-- The stretched link makes the whole card clickable; tags stay links. -->
      <a
        [href]="href()"
        class="hover:text-primary transition-colors after:absolute after:inset-0 focus:outline-none focus-visible:after:ring-2 focus-visible:after:ring-primary focus-visible:after:rounded-2xl"
        >{{ item.title }}</a
      >
    </h3>
    <p class="text-muted-foreground">{{ item.summary }}</p>
    <div class="relative z-10 flex flex-wrap gap-2 pt-1">
      @for (tag of item.tags; track $index) {
        <a
          [href]="tagHref(tag)"
          class="px-3 py-1 rounded-full bg-surface text-xs font-medium border border-border/50 text-muted-foreground hover:border-primary/50 hover:text-primary transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
          >{{ tag }}</a
        >
      }
    </div>
  </div>
</article>
