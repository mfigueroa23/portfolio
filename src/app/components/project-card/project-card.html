<a
  href="/projects/{{ project().slug }}"
  class="group glass rounded-2xl overflow-hidden h-full flex flex-col hover:border-primary/40 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-primary"
>
  <!-- Image -->
  <div class="relative overflow-hidden aspect-video">
    <img
      [src]="project().image"
      [alt]="project().title"
      loading="lazy"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
    />
    <div
      class="absolute inset-0 bg-linear-to-t from-card via-card/50 to-transparent opacity-60"
    ></div>
  </div>

  <!-- Content -->
  <div class="p-6 space-y-4 flex-1">
    <div class="flex items-start justify-between gap-4">
      @if (headingLevel() === 2) {
        <h2 class="text-xl font-semibold group-hover:text-primary transition-colors">
          {{ project().title }}
        </h2>
      } @else {
        <h3 class="text-xl font-semibold group-hover:text-primary transition-colors">
          {{ project().title }}
        </h3>
      }
      <i
        class="fa-solid fa-arrow-right -rotate-45 text-muted-foreground group-hover:text-primary group-hover:translate-x-1 group-hover:-translate-y-1 transition-all"
        aria-hidden="true"
      ></i>
    </div>
    <p class="text-muted-foreground text-sm">{{ project().description }}</p>
    <div class="flex flex-wrap gap-2">
      @for (tag of project().tags; track $index) {
        <span
          class="px-4 py-1.5 rounded-full bg-surface text-xs font-medium border border-border/50 text-muted-foreground"
          >{{ tag }}</span
        >
      }
    </div>
  </div>
</a>
