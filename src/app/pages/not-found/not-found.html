<section class="container mx-auto px-6 pt-40 pb-32">
  <article class="glass rounded-2xl p-12 max-w-2xl mx-auto text-center animate-fade-in">
    <div class="w-14 h-14 rounded-xl bg-primary/10 flex items-center justify-center mx-auto mb-4">
      <i class="fa-solid fa-compass text-2xl text-primary" aria-hidden="true"></i>
    </div>
    <p class="text-secondary-foreground text-sm font-medium tracking-wider uppercase">404</p>
    <h1 class="text-3xl md:text-4xl font-bold mt-2 mb-4">{{ m().pages.notFound.title }}</h1>
    <p class="text-muted-foreground mb-8">{{ m().pages.notFound.text }}</p>
    <app-button [href]="language.href('/')">{{ m().pages.backHome }}</app-button>
  </article>
</section>
